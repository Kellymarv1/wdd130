<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Contact Us | Exciting Expeditions</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="description"
      content="Contact us to reach Exciting Expeditions for bookings, trip questions, or support. Our team is ready to help with rafting reservations, group adventures, and any feedback about your outdoor experience. Use the form to send a message, request a newsletter subscription, or get quick answers from our expert guides.">
    <meta name="author" content="Kehinde Marvellous">
</head>

<body>
    <header>
        <img src="images/boat.png" alt="Company Logo" class="logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="company-info">
            <h1>Contact Us</h1>
            <p><strong>Exciting Expeditions</strong></p>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>

        <div class="grid">
            <iframe class="map"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3187.3159256795375!2d-122.02913262492845!3d36.978391472196904!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808e402563ff7b33%3A0x5912c5ee33d84140!2s123%20River%20St%2C%20Santa%20Cruz%2C%20CA%2095060%2C%20USA!5e0!3m2!1sen!2sng!4v1780602052078!5m2!1sen!2sng"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>

            <form action="" class="contact-form">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder" required>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <fieldset class="purpose-fieldset">

                    <span class="purpose-label">Message Purpose</span>

                    <div class="radios">
                        <label><input type="radio" id="general" name="purpose" value="general"
                              checked> General
                            Inquiry</label>
                        <label><input type="radio" id="reservation" name="purpose"
                              value="reservation">
                            Reservation Question</label>
                        <label><input type="radio" id="suggestion" name="purpose"
                              value="suggestion"> Website
                            Suggestion</label>
                    </div>
                </fieldset>

                <div class="message-row">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Type here"
                      rows="6"></textarea>
                </div>

                <div class="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter" checked>
                    <label for="newsletter">Please Subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>

            </form>
        </div>
    </main>

    <section>
        <h2>Adventure Awaits You!</h2>
        <div class="adventure-row">
            <figure>
                <img src="images/bot.jpg" alt="Stationary rafts" />
                <figcaption>Rafts</figcaption>
            </figure>

            <figure>
                <img src="images/paddle.jpg" alt="Paddle swinging" />
                <figcaption>Paddles</figcaption>
            </figure>

            <figure>
                <img src="images/helmet.jpg" alt="Helmet list" />
                <figcaption>Helmets</figcaption>
            </figure>
        </div>
    </section>
    <footer>
        <p>&copy; 2026 🌊Exciting Expeditions🌊 Kehinde Marvellous</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="Linkedin Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>


</body>

</html>
